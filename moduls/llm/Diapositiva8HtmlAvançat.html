  <h1>Formularis amb HTML: label</h1>
  <p>L’etiqueta <code>&lt;label&gt;</code> s’utilitza per etiquetar els camps d’un formulari i millorar-ne l’accessibilitat.</p>
  <p>És important associar cada etiqueta amb el camp corresponent perquè el formulari sigui més fàcil d’entendre i utilitzar.</p>
