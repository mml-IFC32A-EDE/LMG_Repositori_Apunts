<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taules bàsiques amb HTML</title>
</head>
<body>
  <h1>Taules bàsiques amb HTML</h1>
  <ul>
    <li><code>&lt;table&gt;</code>: defineix la taula i actua com a contenidor principal.</li>
    <li><code>&lt;tr&gt;</code> (table row): defineix una fila dins de la taula.</li>
    <li><code>&lt;td&gt;</code> (table data): crea una cel·la dins d’una fila de la taula.</li>
  </ul>
</body>
</html>
