<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formularis amb HTML: input</title>
</head>
<body>
  <h1>Formularis amb HTML: input</h1>
  <p>L’etiqueta <code>&lt;input&gt;</code> és l’element més versàtil per crear camps d’entrada.</p>
  <p>El tipus de camp es defineix amb l’atribut <code>type</code>.</p>
  <ul>
    <li><code>text</code>: camp per introduir text.</li>
    <li><code>email</code>: camp per introduir una adreça de correu electrònic.</li>
    <li><code>password</code>: camp per introduir una contrasenya.</li>
  </ul>
</body>
</html>
