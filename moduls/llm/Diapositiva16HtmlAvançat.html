<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validació de formularis</title>
</head>
<body>
  <h1>Validació de formularis</h1>
  <p>HTML5 introdueix nous atributs i tipus d’entrada que permeten validar formularis de manera nativa, sense necessitat de JavaScript.</p>
  <ul>
    <li><code>required</code>: indica que el camp és obligatori i no es pot deixar buit.</li>
    <li><code>pattern</code>: defineix un patró que ha de complir el valor introduït.</li>
  </ul>
</body>
</html>
