  <h1>Formularis amb HTML: select</h1>
  <p>L’etiqueta <code>&lt;select&gt;</code> es fa servir per crear llistes desplegables de selecció.</p>
  <p>Cada opció de la llista es defineix amb l’etiqueta <code>&lt;option&gt;</code>.</p>
