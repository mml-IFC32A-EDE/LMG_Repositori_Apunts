<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taules bàsiques amb HTML: atributs</title>
</head>
<body>
  <h1>Taules bàsiques amb HTML: atributs</h1>
  <ul>
    <li><code>border</code>: afegeix una vora a la taula i a les cel·les.</li>
    <li><code>cellpadding</code>: defineix l’espai entre el contingut de la cel·la i la seva vora.</li>
    <li><code>cellspacing</code>: controla l’espai entre les cel·les de la taula.</li>
  </ul>
</body>
</html>
